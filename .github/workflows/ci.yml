name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - run: mix deps.get
      - name: Validate TCP resource report parser
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: mix format --check-formatted
      - run: mix test --cover

      - name: Fetch AtomVM example dependencies
        working-directory: examples/hello_atomvm_modbus
        run: mix deps.get

      - name: Check AtomVM compatibility
        working-directory: examples/hello_atomvm_modbus
        run: |
          MIX_ENV=prod mix clean
          MIX_ENV=prod mix atomvm.check

      - name: Check AtomVM workflow probe
        working-directory: examples/hello_atomvm_modbus
        run: |
          MIX_ENV=prod mix clean
          MODBUS_WORKFLOW_PROBE=true MIX_ENV=prod mix atomvm.check

      - name: Check AtomVM resource probe
        working-directory: examples/hello_atomvm_modbus
        run: |
          MIX_ENV=prod mix clean
          MODBUS_RESOURCE_PROBE=true MIX_ENV=prod mix atomvm.check

      - name: Build and size-check AtomVM package
        working-directory: examples/hello_atomvm_modbus
        run: |
          MIX_ENV=prod mix clean
          MIX_ENV=prod mix atomvm.size

      - name: Fetch Modbus distributed Erlang example dependencies
        working-directory: examples/hello_atomvm_modbus_disterl
        run: mix deps.get

      - name: Test Modbus distributed Erlang example
        working-directory: examples/hello_atomvm_modbus_disterl
        run: |
          mix format --check-formatted
          mix test

      - name: Check Phase 1 client and server builds
        working-directory: examples/hello_atomvm_modbus_disterl
        run: |
          for role in client server; do
            MIX_ENV=prod mix clean
            MODBUS_ROLE="$role" MIX_ENV=prod mix atomvm.check
          done

      - name: Check distributed Erlang client and server builds
        working-directory: examples/hello_atomvm_modbus_disterl
        run: |
          for role in client server; do
            MIX_ENV=prod mix clean
            MODBUS_EXPERIMENT=disterl MODBUS_ROLE="$role" MIX_ENV=prod mix atomvm.check
          done

  interoperability:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install independent Modbus peers
        run: |
          sudo apt-get update
          sudo apt-get install -y libmodbus-dev pkg-config gcc
          python -m venv .venv
          .venv/bin/python -m pip install 'pymodbus==3.15.0' pyserial

      - run: mix deps.get

      - name: Verify TCP, RTU, and ASCII interoperability (two seeds)
        env:
          LIBMODBUS_INTEROP: '1'
          PYMODBUS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          for seed in 12345 54321; do
            echo "Running independent Modbus peers with ExUnit seed=$seed"
            mix test --seed "$seed" --include interop --include libmodbus \
              test/avmodbus/pymodbus_interop_test.exs \
              test/avmodbus/libmodbus_interop_test.exs
          done
